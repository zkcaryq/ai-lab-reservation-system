# AI 智能实验室预约系统 · 单端口入口
# 静态前端 + 反向代理 /api /uploads /health 到后端容器，浏览器只看到同一个源。

upstream api_backend {
    # 写固定 IP 而不是容器名 api：容器重建后 IP 才稳定，
    # nginx 在启动时只解析一次 upstream，用容器名会缓存旧 IP 导致 502。
    # 该地址由 compose.yaml 的 api.ipv4_address 固定，两处要一起改。
    server 10.211.0.10:8000;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 后端请求体上限为 24 MiB，这里留出 multipart 开销。
    client_max_body_size 32m;

    # 上传大文件与 SSE 流式回答都不希望被 gzip 缓冲打乱，只压缩静态文本资源。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 静态资源带内容哈希，可以长期缓存；index.html 必须每次回源。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- 后端接口：保持原始 URI 转发 ----
    location /api/ {
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # 头像等公开上传文件由后端 StaticFiles 提供。
    location /uploads/ {
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    location /health/ {
        proxy_pass http://api_backend;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # ---- 前端 SPA：vue-router 使用 history 模式，未知路径回落到 index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
